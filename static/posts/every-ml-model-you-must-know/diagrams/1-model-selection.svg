<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img">
  <rect width="970" height="420" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#4f46e5"/></marker><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#ea580c"/></marker></defs>
  <text x="485.0" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Picking a Model, as a Decision Tree</text>
  <text x="485.0" y="55" text-anchor="middle" font-size="13" fill="#64748b">The question is about the data first, never the model</text>
<rect x="60.0" y="150.0" width="150.0" height="54.0" rx="12" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
<text x="135.0" y="173.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">What is your</text>
<text x="135.0" y="191.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">input?</text>
<line x1="216.0" y1="177.0" x2="264.0" y2="108.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="270.0" y="86.0" width="168.0" height="44.0" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="354.0" y="113.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">A table of columns</text>
<line x1="216.0" y1="177.0" x2="264.0" y2="200.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="270.0" y="178.0" width="168.0" height="44.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<text x="354.0" y="205.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Pixels or audio</text>
<line x1="442.0" y1="200.0" x2="486.0" y2="200.0" stroke="#0d9488" stroke-width="2" marker-end="url(#a)"/>
<rect x="492.0" y="176.0" width="300.0" height="44.0" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
<text x="642.0" y="198.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Fine-tune a pretrained CNN or ViT</text>
<line x1="216.0" y1="177.0" x2="264.0" y2="264.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="270.0" y="242.0" width="168.0" height="44.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<text x="354.0" y="269.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Text</text>
<line x1="442.0" y1="264.0" x2="486.0" y2="264.0" stroke="#0d9488" stroke-width="2" marker-end="url(#a)"/>
<rect x="492.0" y="240.0" width="300.0" height="48.0" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
<text x="642.0" y="256.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">TF-IDF + logistic to baseline,</text>
<text x="642.0" y="273.0" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">then fine-tune a small transformer</text>
<line x1="216.0" y1="177.0" x2="264.0" y2="342.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="270.0" y="320.0" width="168.0" height="44.0" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
<text x="354.0" y="347.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">No labels at all</text>
<line x1="442.0" y1="342.0" x2="486.0" y2="342.0" stroke="#be123c" stroke-width="2" marker-end="url(#a)"/>
<rect x="492.0" y="318.0" width="300.0" height="44.0" rx="10" fill="#f8fafc" stroke="#be123c" stroke-width="2"/>
<text x="642.0" y="340.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">k-means, or HDBSCAN when messy</text>
<line x1="442.0" y1="108.0" x2="486.0" y2="108.0" stroke="#4f46e5" stroke-width="2" marker-end="url(#b)"/>
<rect x="492.0" y="64.0" width="158.0" height="48.0" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="571.0" y="84.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Must you explain</text>
<text x="571.0" y="101.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">each prediction?</text>
<line x1="654.0" y1="80.0" x2="700.0" y2="62.0" stroke="#4f46e5" stroke-width="2" marker-end="url(#b)"/>
<line x1="654.0" y1="96.0" x2="700.0" y2="130.0" stroke="#4f46e5" stroke-width="2" marker-end="url(#b)"/>
<text x="679.0" y="70.0" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">yes</text>
<text x="677.0" y="134.0" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">no</text>
<rect x="706.0" y="38.0" width="218.0" height="38.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="815.0" y="62.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Logistic / linear regression</text>
<rect x="706.0" y="112.0" width="218.0" height="48.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="815.0" y="131.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Gradient boosting</text>
<text x="815.0" y="148.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">or TabPFN if the table is small</text>
<text x="480.0" y="392.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Almost every real business problem is the top branch, and on that branch boosting is the thing to beat.</text>
  <text x="485.0" y="406" text-anchor="middle" font-size="12.5" fill="#475569">Fitting, given the rest of this post: the way you choose a model is itself a series of splits.</text>
</svg>
