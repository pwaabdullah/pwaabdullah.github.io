<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img">
  <rect width="900" height="512" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#4f46e5"/></marker><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#ea580c"/></marker><marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#0d9488"/></marker></defs>
  <text x="450.0" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">The Two-Tower Model</text>
  <text x="450.0" y="55" text-anchor="middle" font-size="13" fill="#64748b">How retrieval from a hundred million items fits in a few milliseconds</text>
<rect x="60.0" y="110.0" width="190.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
<text x="155.0" y="135.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">query / user / context</text>
<line x1="155.0" y1="154.0" x2="155.0" y2="178.0" stroke="#4f46e5" stroke-width="2" marker-end="url(#b)"/>
<rect x="60.0" y="182.0" width="190.0" height="44.0" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="155.0" y="202.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">query tower</text>
<text x="155.0" y="218.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">runs live, per request</text>
<line x1="155.0" y1="230.0" x2="155.0" y2="254.0" stroke="#4f46e5" stroke-width="2" marker-end="url(#b)"/>
<rect x="88.0" y="258.0" width="134.0" height="32.0" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="155.0" y="279.0" text-anchor="middle" font-size="12" font-weight="600" fill="#4f46e5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">query vector</text>
<rect x="650.0" y="110.0" width="190.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
<text x="745.0" y="135.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">one catalogue item</text>
<line x1="745.0" y1="154.0" x2="745.0" y2="178.0" stroke="#ea580c" stroke-width="2" marker-end="url(#c)"/>
<rect x="650.0" y="182.0" width="190.0" height="44.0" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="745.0" y="202.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">item tower</text>
<text x="745.0" y="218.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">runs once, offline</text>
<line x1="745.0" y1="230.0" x2="745.0" y2="254.0" stroke="#ea580c" stroke-width="2" marker-end="url(#c)"/>
<rect x="678.0" y="258.0" width="134.0" height="32.0" rx="7" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
<text x="745.0" y="279.0" text-anchor="middle" font-size="12" font-weight="600" fill="#ea580c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">item vector</text>
<rect x="640.0" y="312.0" width="210.0" height="54.0" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="745.0" y="334.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">vector index</text>
<text x="745.0" y="352.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#64748b">every item, embedded ahead of time</text>
<line x1="745.0" y1="292.0" x2="745.0" y2="308.0" stroke="#ea580c" stroke-width="2" marker-end="url(#c)"/>
<text x="450.0" y="196.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">dot product</text>
<path d="M232,274 L430,274" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M668,274 L470,274" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="450" cy="274" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="450.0" y="280.0" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">&#183;</text>
<text x="450.0" y="224.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">high for the right pair,</text>
<text x="450.0" y="240.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">low for everything else</text>
<rect x="300.0" y="330.0" width="300.0" height="86.0" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<text x="450.0" y="352.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0d9488">in-batch negatives</text>
<text x="450.0" y="371.0" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">in a batch of 1,024 pairs, the other 1,023</text>
<text x="450.0" y="387.0" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">items are the negatives for each query.</text>
<text x="450.0" y="403.0" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">1,023 negatives, no mining pipeline.</text>
<text x="450.0" y="448.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">The towers never see each other, and that is the entire point: the item side can be precomputed.</text>
<text x="450.0" y="470.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">It is also the ceiling, which is why a reranker that does see both runs afterwards.</text>
  <text x="450.0" y="498" text-anchor="middle" font-size="12.5" fill="#475569">Run the item tower once for the catalogue, the query tower once per request, then search the index.</text>
</svg>
