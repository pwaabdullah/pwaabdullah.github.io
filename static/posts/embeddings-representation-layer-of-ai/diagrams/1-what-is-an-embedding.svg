<text x="465.0" y="318.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Nobody wrote those numbers. They are whatever made the training task easier.</text>
<text x="465.0" y="340.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">The same table works for words, users, ads, merchants or cities. Only the IDs change.</text>
  <text x="465.0" y="370" text-anchor="middle" font-size="12.5" fill="#475569">One-hot says every item is equally unrelated to every other. An embedding is free to disagree.</text>
