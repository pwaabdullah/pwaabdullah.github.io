<text x="818.0" y="242.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#0d9488" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.71</text>
<text x="500.0" y="300.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#ea580c">by dot product (angle and length)</text>
