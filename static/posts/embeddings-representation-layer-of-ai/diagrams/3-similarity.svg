<text x="255.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">three candidates against one query</text>
<text x="255.0" y="372.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">length encodes how popular or verbose an item is</text>
<text x="500.0" y="96.0" text-anchor="start" font-size="13" font-weight="700" fill="#475569">the two rankings disagree</text>
<text x="500.0" y="132.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#4f46e5">by cosine (angle only)</text>
