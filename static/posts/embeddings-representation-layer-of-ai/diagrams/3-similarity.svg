<text x="534.0" y="410.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">niche exact match</text>
<text x="818.0" y="410.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#4f46e5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.90</text>
<text x="665.0" y="462.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#be123c">Same vectors. The niche match is first by cosine and last by dot.</text>
  <text x="440.0" y="492" text-anchor="middle" font-size="12.5" fill="#475569">Normalize your vectors and the question disappears: cosine, dot and Euclidean then rank identically.</text>
