<text x="534.0" y="374.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">loosely related</text>
<text x="818.0" y="374.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#0d9488" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.10</text>
