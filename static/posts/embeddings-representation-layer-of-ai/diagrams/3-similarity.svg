  <text x="440.0" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Cosine, Dot Product, and Why It Matters</text>
  <text x="440.0" y="55" text-anchor="middle" font-size="13" fill="#64748b">The long vector wins on dot product and loses on cosine</text>
