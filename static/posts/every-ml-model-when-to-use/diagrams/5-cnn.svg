  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">How a CNN Actually Sees</text>
  <text x="440" y="55" text-anchor="middle" font-size="13" fill="#64748b">Two ideas do all the work: reuse one filter everywhere, then stack</text>
  <text x="440" y="396" text-anchor="middle" font-size="12.5" fill="#475569">This is why you fine-tune instead of training from scratch: early layers already know what an edge is.</text>
