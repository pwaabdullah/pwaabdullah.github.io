<text x="796.0" y="365.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ea580c">BIAS</text>
<text x="442.0" y="432.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">That single difference, parallel-and-average against sequential-and-correct, explains everything else about them.</text>
  <text x="442.0" y="446" text-anchor="middle" font-size="12.5" fill="#475569">Boosting is more accurate and easier to overfit. Both facts come from the same arrow.</text>
