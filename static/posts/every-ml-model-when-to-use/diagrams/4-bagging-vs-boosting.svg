  <text x="442.0" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Bagging and Boosting Are Opposite Ideas</text>
  <text x="442.0" y="55" text-anchor="middle" font-size="13" fill="#64748b">Both build many trees. Only one of them lets the trees see each other's mistakes</text>
<text x="56.0" y="100.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#4f46e5">BAGGING  (random forest)</text>
<text x="56.0" y="120.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#64748b">train independently, in parallel, then average</text>
