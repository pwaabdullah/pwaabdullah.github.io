<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img">
  <rect width="790" height="462" fill="#ffffff"/>

  <text x="395.0" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Attention, One Word at a Time</text>
  <text x="395.0" y="55" text-anchor="middle" font-size="13" fill="#64748b">Every number here is computed, not illustrative. Four steps, no magic</text>
<text x="150.0" y="96.0" text-anchor="start" font-size="13" font-weight="700" fill="#475569">Query from "cat" against every key, then mix the values</text>
<rect x="150" y="128" width="168" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="234.0" y="150.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">key of "the"</text>
<rect x="346" y="128" width="168" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="430.0" y="150.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">key of "cat"</text>
<rect x="542" y="128" width="168" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="626.0" y="150.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">key of "sat"</text>
<text x="138.0" y="208.0" text-anchor="end" font-size="12" font-weight="600" fill="#475569">1. score  q &#183; k</text>
<rect x="184" y="186" width="100" height="34" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="234.0" y="208.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">0.55</text>
<rect x="380" y="186" width="100" height="34" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="430.0" y="208.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">2.60</text>
<rect x="576" y="186" width="100" height="34" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="626.0" y="208.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">1.85</text>
<text x="138.0" y="260.0" text-anchor="end" font-size="12" font-weight="600" fill="#475569">2. scale  &#247; &#8730;4</text>
<rect x="184" y="238" width="100" height="34" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="234.0" y="260.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">0.28</text>
<rect x="380" y="238" width="100" height="34" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="430.0" y="260.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">1.30</text>
<rect x="576" y="238" width="100" height="34" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="626.0" y="260.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">0.93</text>
<text x="138.0" y="312.0" text-anchor="end" font-size="12" font-weight="600" fill="#475569">3. softmax</text>
<rect x="184" y="290" width="100" height="34" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
<text x="234.0" y="312.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ea580c">0.18</text>
<rect x="380" y="290" width="100" height="34" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
<text x="430.0" y="312.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ea580c">0.49</text>
<rect x="576" y="290" width="100" height="34" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
<text x="626.0" y="312.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ea580c">0.34</text>
<text x="138.0" y="356.0" text-anchor="end" font-size="12" font-weight="600" fill="#475569">4. mix values</text>
<text x="234.0" y="352.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">0.18 &#215; v("the")</text>
<text x="430.0" y="352.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">0.49 &#215; v("cat")</text>
<text x="626.0" y="352.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">0.34 &#215; v("sat")</text>
<line x1="184" y1="366" x2="676" y2="366" stroke="#94a3b8" stroke-width="1.5"/>
<text x="676.0" y="392.0" text-anchor="end" font-size="13" font-weight="600" fill="#ea580c">= [0.558, 0.366]  the new vector for "cat"</text>
<text x="380.0" y="414.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">"cat" gives itself 49% of the weight and "sat" 34%, because those keys matched its query. "the" gets 18%.</text>
  <text x="395.0" y="448" text-anchor="middle" font-size="12.5" fill="#475569">Do this for every word at once and you have a transformer layer's attention.</text>
</svg>
