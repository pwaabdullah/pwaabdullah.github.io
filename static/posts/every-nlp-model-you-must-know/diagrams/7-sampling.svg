<text x="465.0" y="342.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">The prompt is "The cat sat on the ___". Same model, same forward pass, same logits. Only the sampling settings differ.</text>
<text x="465.0" y="364.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Temperature reshapes the distribution. Top-k and top-p delete part of it. That is the whole difference.</text>
  <text x="465.0" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">The Knobs That Decide What It Says</text>
  <text x="465.0" y="55" text-anchor="middle" font-size="13" fill="#64748b">One next-token distribution, five settings</text>
  <text x="465.0" y="390" text-anchor="middle" font-size="12.5" fill="#475569">Greedy always takes the orange bar. Sampling picks from whatever survives.</text>
