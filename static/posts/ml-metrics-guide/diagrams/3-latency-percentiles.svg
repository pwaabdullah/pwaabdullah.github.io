<text x="415.0" y="364.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">The mean says 109ms. The p99 says 388ms. Users with 100 calls per page meet the p99 about 63% of the time.</text>
  <text x="415.0" y="384" text-anchor="middle" font-size="12.5" fill="#475569">A long right tail drags the mean but hides the experience. Percentiles do not.</text>
