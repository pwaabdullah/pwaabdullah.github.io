  <text x="415.0" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Why Backprop Runs Backward</text>
  <text x="415.0" y="55" text-anchor="middle" font-size="13" fill="#64748b">Cost scales with whichever end you seed from, and a loss has exactly one output</text>
