<text x="196.0" y="96.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0d9488">Forward mode</text>
<text x="586.0" y="96.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4f46e5">Reverse mode (backprop)</text>
<text x="196.0" y="300.0" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">seed ONE input, get its derivative</text>
<text x="196.0" y="320.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b91c1c">repeat once per parameter</text>
<text x="586.0" y="300.0" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">seed the ONE output, get them all</text>
<text x="586.0" y="320.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4f46e5">a single pass</text>
<line x1="410" y1="86" x2="410" y2="332" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="196.0" y="352.0" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">N passes</text>
<text x="586.0" y="352.0" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">1 pass</text>
<text x="415.0" y="382.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">For a 7B-parameter model that is 7 billion passes against one. This is the whole reason it runs backward.</text>
  <text x="415.0" y="410" text-anchor="middle" font-size="12.5" fill="#475569">Forward mode is not wrong, just the wrong direction when inputs vastly outnumber outputs.</text>
</svg>
