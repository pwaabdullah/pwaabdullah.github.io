<text x="430.0" y="300.0" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a">GQA is the current default.</text>
<text x="430.0" y="322.0" text-anchor="start" font-size="12" font-weight="400" fill="#475569">It keeps most of MQA's memory saving</text>
<text x="430.0" y="340.0" text-anchor="start" font-size="12" font-weight="400" fill="#475569">while staying close to MHA on quality,</text>
<text x="430.0" y="358.0" text-anchor="start" font-size="12" font-weight="400" fill="#475569">which is why LLaMA-2 70B and Mistral</text>
<text x="430.0" y="376.0" text-anchor="start" font-size="12" font-weight="400" fill="#475569">both use it.</text>
<text x="400.0" y="426.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">None of these make the model smarter. They exist because the KV cache outgrows the weights on long context.</text>
  <text x="400.0" y="456" text-anchor="middle" font-size="12.5" fill="#475569">MQA cuts the cache by the head count and costs quality. GQA splits the difference.</text>
