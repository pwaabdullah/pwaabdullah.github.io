<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img">
  <rect width="800" height="404" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#4f46e5"/></marker><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#ea580c"/></marker></defs>
  <text x="400.0" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">One Word, Four Eras</text>
  <text x="400.0" y="55" text-anchor="middle" font-size="13" fill="#64748b">Where the word "bank" lands in each kind of representation</text>
<text x="400.0" y="92.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">Two sentences, the same word: "I sat on the river <tspan font-weight="700" fill="#ea580c">bank</tspan>"   and   "I withdrew cash from the <tspan font-weight="700" fill="#4f46e5">bank</tspan>"</text>
<text x="134.0" y="132.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">one-hot</text>
<text x="134.0" y="149.0" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">one slot set to 1</text>
<rect x="56.0" y="160.0" width="156.0" height="150.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<circle cx="134" cy="238" r="9" fill="#475569"/>
<text x="134.0" y="266.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">one point</text>
<text x="134.0" y="282.0" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">for both</text>
<line x1="216.0" y1="238.0" x2="236.0" y2="238.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="320.0" y="132.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">TF-IDF</text>
<text x="320.0" y="149.0" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">a weighted count</text>
<rect x="242.0" y="160.0" width="156.0" height="150.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<circle cx="320" cy="238" r="9" fill="#475569"/>
<text x="320.0" y="266.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">one point</text>
<text x="320.0" y="282.0" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">for both</text>
<line x1="402.0" y1="238.0" x2="422.0" y2="238.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="506.0" y="132.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">word2vec</text>
<text x="506.0" y="149.0" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">a learned vector</text>
<rect x="428.0" y="160.0" width="156.0" height="150.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<circle cx="506" cy="238" r="9" fill="#475569"/>
<text x="506.0" y="266.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">one point</text>
<text x="506.0" y="282.0" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">for both</text>
<line x1="588.0" y1="238.0" x2="608.0" y2="238.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="692.0" y="132.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">contextual</text>
<text x="692.0" y="149.0" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">a vector per use</text>
<rect x="614.0" y="160.0" width="156.0" height="150.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<circle cx="660" cy="212" r="9" fill="#ea580c"/>
<text x="660.0" y="196.0" text-anchor="middle" font-size="11" font-weight="600" fill="#ea580c">river</text>
<circle cx="726" cy="270" r="9" fill="#4f46e5"/>
<text x="726.0" y="292.0" text-anchor="middle" font-size="11" font-weight="600" fill="#4f46e5">money</text>
<text x="400.0" y="340.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">The first three cannot tell those two sentences apart, because none of them ever read the sentence.</text>
<text x="400.0" y="362.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">That single limitation is what the next twenty years of NLP was spent fixing.</text>
  <text x="400.0" y="390" text-anchor="middle" font-size="12.5" fill="#475569">Static embeddings collapse every meaning of a word into a single point. Context-dependent ones do not.</text>
</svg>
