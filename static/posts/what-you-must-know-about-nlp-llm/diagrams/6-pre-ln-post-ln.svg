<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img">
  <rect width="800" height="468" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#4f46e5"/></marker><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#ea580c"/></marker></defs>
  <text x="400.0" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Where the Norm Sits</text>
  <text x="400.0" y="55" text-anchor="middle" font-size="13" fill="#64748b">One line of code, and the reason modern LLMs are as deep as they are</text>
<text x="190.0" y="100.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">pre-LN</text>
<text x="190.0" y="118.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">normalize inside the branch</text>
<rect x="140.0" y="140.0" width="100.0" height="30.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="190.0" y="160.0" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">input x</text>
<line x1="190.0" y1="172.0" x2="190.0" y2="190.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="140.0" y="194.0" width="100.0" height="30.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
<text x="190.0" y="214.0" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">LayerNorm</text>
<line x1="190.0" y1="226.0" x2="190.0" y2="236.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="140.0" y="238.0" width="100.0" height="30.0" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<text x="190.0" y="258.0" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Attention</text>
<line x1="190.0" y1="270.0" x2="190.0" y2="280.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<circle cx="190" cy="294" r="13" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<text x="190.0" y="299.0" text-anchor="middle" font-size="15" font-weight="600" fill="#ea580c">+</text>
<path d="M140,155 L94,155 L94,294 L173,294" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#c)"/>
<text x="94.0" y="136.0" text-anchor="middle" font-size="11" font-weight="600" fill="#ea580c">residual</text>
<text x="550.0" y="100.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">post-LN</text>
<text x="550.0" y="118.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">normalize after the add</text>
<rect x="500.0" y="140.0" width="100.0" height="30.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="550.0" y="160.0" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">input x</text>
<line x1="550.0" y1="172.0" x2="550.0" y2="190.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="500.0" y="194.0" width="100.0" height="30.0" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<text x="550.0" y="214.0" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Attention</text>
<line x1="550.0" y1="226.0" x2="550.0" y2="236.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<circle cx="550" cy="250" r="13" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<text x="550.0" y="255.0" text-anchor="middle" font-size="15" font-weight="600" fill="#ea580c">+</text>
<line x1="550.0" y1="264.0" x2="550.0" y2="274.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="500.0" y="278.0" width="100.0" height="30.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
<text x="550.0" y="298.0" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">LayerNorm</text>
<path d="M500,155 L454,155 L454,250 L533,250" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#c)"/>
<text x="454.0" y="136.0" text-anchor="middle" font-size="11" font-weight="600" fill="#ea580c">residual</text>
<text x="190.0" y="344.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4f46e5">residual path stays clean</text>
<text x="190.0" y="362.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">deep stacks train</text>
<text x="550.0" y="340.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#be123c">every layer rescales the path</text>
<text x="550.0" y="358.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">needs careful warmup</text>
<line x1="330" y1="90" x2="330" y2="374" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="400.0" y="404.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">Same sublayers, same order. Only the norm moves,</text>
<text x="400.0" y="422.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">and that decided whether deep transformers train at all.</text>
  <text x="400.0" y="454" text-anchor="middle" font-size="12.5" fill="#475569">The feed-forward sublayer repeats this same wrapper. Pre-LN won, and every modern LLM uses it.</text>
</svg>
